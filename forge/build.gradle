plugins {
    id 'multiloader-loader'
    id 'net.minecraftforge.gradle'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

// 归档名交给 build-logic 的 multiloader-common 统一处理
// （<mod_id>-<version>-<loader>-<MC 区间>），此处不得再覆盖。
// 本分支 build-logic 不带公共 repositories（各模块自带），forge 需要
// Sponge 仓库解析 mixin 注解处理器（0.8.5-SNAPSHOT 只在 Sponge 快照库）。
repositories {
    maven { name = 'Sponge'; url = 'https://repo.spongepowered.org/repository/maven-public' }
    maven { name = 'Aliyun Public'; url = 'https://maven.aliyun.com/repository/public' }
}

mixin {
    add(sourceSets.main, "${mod_id}.refmap.json")
    config("${mod_id}.mixins.json")
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    copyIdeResources = true // Calls processResources when in dev

    // 1.20.2~1.20.4 Forge 在运行期使用 SRG 映射，因此必须 reobf（与 1.20-1.20.1 分支同口径）；
    // 1.20.6+ 才是 official 运行期（reobf = false）。
    reobf = true

    // Automatically enable Forge AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformer = at
    }

    runs {
        client {
            workingDirectory project.file('runs/client')
            property 'forge.enabledGameTestNamespaces', mod_id
            mods {
                modClientRun {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('runs/server')
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
            mods {
                modServerRun {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('runs/data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods {
                modDataRun {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor("org.spongepowered:mixin:0.8.5-SNAPSHOT:processor")

    // Forge's hack fix
    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }
}

jar {
    finalizedBy('reobfJar')
    manifest.attributes([
            "MixinConfigs": "${mod_id}.mixins.json"
    ])
}

// Forge 线自带 Mixin 0.8.5 只识别到 JAVA_17（Fabric 自带的新版 Mixin 才认 JAVA_21+）：
// 1) forge 模块统一按 Java 17 字节码编译（运行于更高 JVM 的 MC 不受影响）
// 2) 打包时把 common 带来的 mixins.json 兼容级改写为 JAVA_17（实测 1.20.4/1.20.6 崩溃根因）
java {
    // 用 target 17 而非 options.release：release 会把解析属性 org.gradle.jvm.version 拉到 17，
    // 与 :common / FML 依赖发布的 Java 21 变体冲突（"only compatible with JVM runtime 21+"）。
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.named('processResources') {
    doLast {
        def f = layout.buildDirectory.file('resources/main/onlytpviolentbuild.mixins.json').get().asFile
        if (f.exists()) {
            def t = f.getText('UTF-8')
            def fixed = t.replaceAll('"compatibilityLevel":\\s*"JAVA_\\d+"', '"compatibilityLevel": "JAVA_17"')
            // SRG 运行期必须带 refmap 键（common 基线是 Loom 风格、没有它 ⇒ "No refMap loaded"）
            if (!fixed.contains('"refmap"')) {
                fixed = fixed.replace('"package":', "\"refmap\": \"${mod_id}.refmap.json\",\n  \"package\":")
            }
            if (fixed != t) {
                f.setText(fixed, 'UTF-8')
            }
        }
    }
}
