plugins {
    id 'multiloader-loader'
    id 'net.minecraftforge.gradle'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

// 归档名交给 build-logic 的 multiloader-common 统一处理
// （<mod_id>-<version>-<loader>-<MC 区间>），此处不得再覆盖。
// 本分支 build-logic 不带公共 repositories（各模块自带），forge 需要
// Sponge 仓库解析 mixin 注解处理器（0.8.5-SNAPSHOT 只在 Sponge 快照库）。
repositories {
    maven { name = 'Sponge'; url = 'https://repo.spongepowered.org/repository/maven-public' }
    maven { name = 'Aliyun Public'; url = 'https://maven.aliyun.com/repository/public' }
}

mixin {
    config("${mod_id}.mixins.json")
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    copyIdeResources = true // Calls processResources when in dev

    // 1.20.6 Forge 运行期使用官方映射，不做 official→SRG 的 reobf
    // （与 1.21-1.21.1 分支同口径；1.20.2~1.20.4 才需要 reobf = true）。
    reobf = false

    // Automatically enable Forge AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformer = at
    }

    runs {
        client {
            workingDirectory project.file('runs/client')
            property 'forge.enabledGameTestNamespaces', mod_id
            mods {
                modClientRun {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('runs/server')
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
            mods {
                modServerRun {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('runs/data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods {
                modDataRun {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor("org.spongepowered:mixin:0.8.5-SNAPSHOT:processor")

    // Forge's hack fix
    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }
}

jar {
    manifest.attributes([
            "MixinConfigs": "${mod_id}.mixins.json"
    ])
}

// Forge 线自带 Mixin 0.8.5 只识别到 JAVA_17（Fabric 自带的新版 Mixin 才认 JAVA_21+）：
// 1) forge 模块统一按 Java 17 字节码编译（运行于更高 JVM 的 MC 不受影响）
// 2) 打包时把 common 带来的 mixins.json 兼容级改写为 JAVA_17（实测 1.20.4/1.20.6 崩溃根因）
// Forge 1.20.6 自带 Mixin 0.8.5：只识别 JAVA_17、且自带 ASM 不支持 Java 21 类文件（major 65）。
// :common 以 Java 21 发布，若把编译目标降到 17 会与解析属性冲突（jvm.version 17 vs 21），
// 因此保持 Java 21 编译，在编译完成后把 class 文件 major 版本统一降为 61（Java 17）。
// 本模组未使用 Java 18+ 语言特性，降级安全；mixins.json 兼容级同步改写为 JAVA_17（见下）。
tasks.named('compileJava', JavaCompile) {
    doLast {
        fileTree(destinationDirectory.get().asFile).matching { include '**/*.class' }.each { f ->
            def bytes = f.getBytes()
            if (bytes.length > 8 && bytes[6] == (byte) 0 && (bytes[7] & 0xFF) > 61) {
                bytes[7] = (byte) 61
                f.setBytes(bytes)
            }
        }
    }
}

tasks.named('processResources') {
    doLast {
        def f = layout.buildDirectory.file('resources/main/onlytpviolentbuild.mixins.json').get().asFile
        if (f.exists()) {
            def t = f.getText('UTF-8')
            def fixed = t.replaceAll('"compatibilityLevel":\\s*"JAVA_\\d+"', '"compatibilityLevel": "JAVA_17"')
            if (fixed != t) {
                f.setText(fixed, 'UTF-8')
            }
        }
    }
}
