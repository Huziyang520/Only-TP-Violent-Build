# 1.16.x（目标 1.16.5）单模块 Forge 工程 —— 唯一改动点集中在本文件
version=1.2.0fix
group=com.huziyang520
# 目标字节码（1.16.5 的运行时就是 Java 8，字节码 major 必须 52）
java_version=8

mod_name=Only TP Violent Build
mod_author=huziyang520
mod_id=onlytpviolentbuild
license=MIT
credits=huziyang520
description=Restricts OP players to teleport-only commands on the server.

minecraft_version=1.16.5
# 归档用：jar 文件名里的 MC 区间标签（= 分支名）
mc_range_label=1.16.x
# 区间标签按大版本线给（1.16.x），元数据范围同步放宽；实测只覆盖 1.16.5
minecraft_version_range=[1.16, 1.17)

# Forge：1.16.5 = 36.x、1.16.4 = 35.x、1.16.3 = 34.x、1.16.1 = 32.x
forge_version=36.2.42
forge_loader_version_range=[32,)
# 1.16.5 的 MCP 映射（FG 的 official 通道在此版本不生成产物）
mcp_mappings_version=20210309-1.16.5

# FG 4.1 硬拒 Java 17；FG 5.1 在 1.16.5 上不产出映射后的 Forge 包 ⇒ 只能 FG 3.0 + Gradle 6.8.1 + JDK 8
org.gradle.java.home=C:\\Program Files\\Java\\jre1.8.0_471
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
