# Important Notes:
# Every field you add must be added to build-logic/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=1.2.0Teo
group=com.huziyang520
java_version=25

# Common
minecraft_version=26.3
mod_name=Only TP Violent Build
mod_author=huziyang520
mod_id=onlytpviolentbuild
license=MIT
credits=huziyang520
description=Restricts OP players to teleport-only commands on the server.
minecraft_version_range=[26.3, 26.4)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.160.5+26.3
fabric_loader_version=0.19.5

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
# 26.3 起 neoforge.mods.toml 不再写 modLoader / loaderVersion，neoforge_loader_version_range 属性同步移除
neoforge_version=26.3.0.1-beta

# Forge, see https://maven.minecraftforge.net/net/minecraftforge/forge/ for new versions
# 26.3 线 Forge = 66.x（当前仅 26.3-66.0.2）
forge_version=66.0.2
forge_loader_version_range=[66,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
