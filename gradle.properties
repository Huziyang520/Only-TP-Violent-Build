# Important Notes:
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
# 1.2.0fix：修掉"提示只有写死英文、客户端切中文也不显示中文"的问题（见指南 §14）
version=1.2.0fix
group=com.huziyang520
java_version=17

# Common
minecraft_version=1.18.2
# 归档用：jar 文件名与 maven 坐标里的 MC 区间标签（= 分支名）
mc_range_label=1.18.x
mod_name=Only TP Violent Build
mod_author=huziyang520
mod_id=onlytpviolentbuild
license=MIT
credits=huziyang520
description=Restricts OP players to teleport-only commands on the server.
# 1.18/1.18.1/1.18.2 与本模组相关的三处触点形态一致，故合成一条分支（下界前移）
minecraft_version_range=[1.18, 1.19)

# Fabric
fabric_version=0.51.0+1.18.2
fabric_loader_version=0.13.3

# Forge
forge_version=40.2.21
# Forge 对 1.18 = 38.x、1.18.1 = 39.x、1.18.2 = 40.x ⇒ 覆盖 1.18~1.18.2 时下界取 38
forge_loader_version_range=[38,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
