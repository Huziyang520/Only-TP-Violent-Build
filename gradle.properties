mod_name=Only TP Violent Build
mod_author=huziyang520
mod_id=onlytpviolentbuild
license=MIT
credits=huziyang520
description=Restricts OP players to teleport-only commands on the server.
# 下界前移到 plain 1.20（原分支写 [1.20.1, 1.22) 属虚假承诺：跨不过 1.20.5 的 Java 21 与 1.21 的 API 变更）
minecraft_version_range=[1.20, 1.20.2)
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
