# Important Notes:
# Every field you add must be added to build-logic/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=1.2.0Teo
group=com.huziyang520
java_version=25

# Common
minecraft_version=26.1.2
# 归档用：jar 文件名与 maven 坐标里的 MC 区间标签（= 分支名）
mc_range_label=26.1-26.2
mod_name=Only TP Violent Build
mod_author=huziyang520
mod_id=onlytpviolentbuild
license=MIT
credits=huziyang520
description=Restricts OP players to teleport-only commands on the server.
minecraft_version_range=[26.1, 26.3)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.1.2-1

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.145.4+26.1.2
fabric_loader_version=0.18.6

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
# 本分支覆盖 26.1~26.2，按较低的 26.1.2 编译，NeoForge 依赖区间在 neoforge.mods.toml 内单独写 [26.1,26.3)
neoforge_version=26.1.2.7-beta

# Forge, see https://maven.minecraftforge.net/net/minecraftforge/forge/ for new versions
# 实测（一手 maven 版本表）：26.1 = 62.x、26.1.1 = 63.x、26.1.2 = 64.x、26.2 = 65.x
# ⇒ loader 下界取 62（本分支覆盖 26.1~26.2）；编译点 26.1.2 对应 64 线，取最新 64.1.3
forge_version=64.1.3
forge_loader_version_range=[62,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
