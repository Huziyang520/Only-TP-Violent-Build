// 1.7.x（目标 1.7.10）单模块 Forge 工程
// 档位：ForgeGradle 1.2-SNAPSHOT + Gradle 2.14.1 + JDK 8（该线事实标准）
// 注意：1.7.10 的 Forge 不带 Mixin ⇒ 命令拦截用 Forge 自带的 CommandEvent（见 CommandBlocker）
buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:1.2-SNAPSHOT'
    }
}

apply plugin: 'forge'

version = project.version
group = project.group
archivesBaseName = "${mod_id}-${version}-forge-${mc_range_label}"

sourceCompatibility = '1.8'
targetCompatibility = '1.8'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

minecraft {
    version = minecraft_version + '-' + forge_version
    runDir = 'run'
}

// FG 1.2 把客户端 jar 的下载地址硬编码成早已失效的
// http://s3.amazonaws.com/Minecraft.Download/versions/1.7.10/1.7.10.jar ⇒ 换成可用镜像。
// 必须在 afterEvaluate 里改：FG 是在插件应用阶段给该任务写 url 的，whenTaskAdded 会被它覆盖掉；
// 且 url 是 DelayedString 类型，直接赋 String 不生效。
afterEvaluate {
    tasks.downloadClient.url = new net.minecraftforge.gradle.delayed.DelayedString(
            project, 'https://bmclapi2.bangbang93.com/version/1.7.10/client')
    tasks.downloadServer.url = new net.minecraftforge.gradle.delayed.DelayedString(
            project, 'https://bmclapi2.bangbang93.com/version/1.7.10/server')
}

// mcmod.info 里的值直接写死（Gradle 2.x 没有 filteringCharset，
// 而 Gradle 过滤模板默认用 GBK 会把中文读坏 ⇒ 干脆让资源原样拷贝，不进过滤管线）
processResources {
    inputs.property 'version', project.version
}

jar {
    archiveName = "${mod_id}-${version}-forge-${mc_range_label}.jar"
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : version,
                'Implementation-Title'  : project.name,
                'Implementation-Version': version,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}
