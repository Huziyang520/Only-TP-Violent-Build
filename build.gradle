// 1.12.x（目标 1.12.2）单模块 Forge 工程
// 档位：ForgeGradle 2.3-SNAPSHOT + Gradle 4.10.3 + JDK 8（该线事实标准）
// 注意：Forge 1.12.2 不带 Mixin ⇒ 命令拦截改用 Forge 自带的 CommandEvent（见 CommandBlocker）
buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version = project.version
group = project.group
archivesBaseName = "${mod_id}-${version}-forge-${mc_range_label}"

sourceCompatibility = '1.8'
targetCompatibility = '1.8'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

minecraft {
    version = "${minecraft_version}-${forge_version}"
    runDir = 'run'
    mappings = mcp_mappings_version
}

processResources {
    // Gradle 过滤模板时默认用平台编码（Windows=GBK），会把模板里的中文读坏 ⇒ 显式 UTF-8
    filteringCharset = 'UTF-8'
    inputs.property 'version', project.version
    inputs.property 'mcversion', minecraft_version
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': minecraft_version,
                'modid': mod_id, 'modname': mod_name, 'modauthor': mod_author,
                'moddescription': project.description, 'credits': credits, 'license': license
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    // 名字里已含版本号，直接钉死，避免再追加 -<version>
    archiveName = "${mod_id}-${version}-forge-${mc_range_label}.jar"
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : version,
                'Implementation-Title'  : project.name,
                'Implementation-Version': version,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}
