pluginManagement {
    repositories {
        // 国内镜像优先：阿里云 Gradle 插件仓库（替代 gradlePluginPortal）
        maven {
            name = 'Aliyun Gradle Plugin'
            url = uri('https://maven.aliyun.com/repository/gradle-plugin')
        }
        // 国内镜像优先：阿里云公共仓库（替代 mavenCentral）
        maven {
            name = 'Aliyun Public'
            url = uri('https://maven.aliyun.com/repository/public')
        }
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
                // Loom 1.13.x 只发布旧插件 id `fabric-loom`，它的插件标记组是 `fabric-loom`，
                // 不在 net.fabricmc 子树里，必须显式放行，否则插件解析不到。
                includeGroup('fabric-loom')
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'NeoForged'
                    url = uri('https://maven.neoforged.net/releases')
                }
            }
            filter {
                includeGroupAndSubgroups('net.neoforged')
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Forge'
                    url = uri('https://maven.minecraftforge.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.minecraftforge')
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Sponge'
                    url = uri('https://repo.spongepowered.org/repository/maven-public')
                }
            }
            filter {
                includeGroupAndSubgroups('org.spongepowered')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// This should match the folder name of the project, or else IDEA may complain (see https://youtrack.jetbrains.com/issue/IDEA-317606)
rootProject.name = 'MultiLoader-Template'
includeBuild('build-logic')
include('common')
include('fabric')
include('neoforge')
include('forge')
