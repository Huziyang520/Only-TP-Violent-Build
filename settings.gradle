pluginManagement {
    repositories {
        // 国内镜像优先：阿里云 Gradle 插件仓库（替代 gradlePluginPortal）
        maven {
            name = 'Aliyun Gradle Plugin'
            url = uri('https://maven.aliyun.com/repository/gradle-plugin')
        }
        // 国内镜像优先：阿里云公共仓库（替代 mavenCentral）
        maven {
            name = 'Aliyun Public'
            url = uri('https://maven.aliyun.com/repository/public')
        }
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Forge'
                    url = uri('https://maven.minecraftforge.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.minecraftforge')
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Sponge'
                    url = uri('https://repo.spongepowered.org/repository/maven-public')
                }
            }
            filter {
                includeGroupAndSubgroups('org.spongepowered')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// This should match the folder name of the project, or else IDEA may complain (see https://youtrack.jetbrains.com/issue/IDEA-317606)
rootProject.name = 'MultiLoader-Template'
includeBuild('build-logic')
include('common')
include('fabric')
include('neoforge')
// Forge 端暂不可用：ForgeGradle 6（≤6.0.54）硬性拒绝 Gradle 9.x（"Versions Gradle 9.0 and newer
// are not supported yet"），而本分支 Loom 1.15 / MDG 2.0.141 要求 Gradle 9.2+ ⇒ 无交集。
