# 26.3 起 NeoForge 只支持 javafml，modLoader / loaderVersion 已降级为可选字段，
# 按官方 MDK 不再书写（neoforge_loader_version_range 属性也一并从 expandProps 移除）。
license="${license}"
showAsResourcePack=false

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
# displayURL / issueTrackerURL / iconFile 必须写在 [[mods]] 子表内；写在顶层会被
# NeoForge 静默忽略，模组列表的"主页 / 问题"按钮点不动。
displayURL="https://www.curseforge.com/minecraft/mc-mods/only-tp-violent-build"
issueTrackerURL="https://github.com/Huziyang520/Only-TP-Violent-Build/issues"
# 26.2+ 模组列表分两个图位：iconFile（左侧 1:1 小图标）、bannerFile（右侧详情横幅）。
# 本模组只有方图，故用 iconFile；沿用已废弃的 logoFile 会把方图塞进右侧横幅位。
iconFile="assets/onlytpviolentbuild/icon.png"
authors="${mod_author}"
credits="${credits}"
description='''
[EN] Restricts OP players to teleport-only commands on the server. Issues: https://github.com/Huziyang520/Only-TP-Violent-Build/issues | https://issue.mengcai.online/
[CN] 限制服务端 OP 玩家只能使用传送（TP）相关指令。反馈：https://github.com/Huziyang520/Only-TP-Violent-Build/issues | https://issue.mengcai.online/
'''

# Mixin 必须显式声明，否则 common 里的共享 mixin 全部静默跳过
[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neoforge_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
