# === Gradle 版本锁定（依据《AI模组制作（通用文档）》§1.2 /《AI模组移植（通用文档）》§3）===
# 档位：8.11（三加载器线：fabric-loom 1.8-SNAPSHOT + ModDevGradle 2.0.49-beta + ForgeGradle [6.0.24,6.2)）
# 为什么不能用 9.x / 8.14：ForgeGradle 6 绑定 Gradle 8.x API，且这档插件组合只在 8.11 验证过
# 复用本机缓存：是（~/.gradle/wrapper/dists/gradle-8.11-bin 已存在；原分支写的 8.10 本机没有，按"缓存优先"换 8.11）
# ===
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.11-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
